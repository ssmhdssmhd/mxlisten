<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen 1 - 在线音乐播放器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <img src="/static/images/logo.png" alt="Listen 1">
                <span>Listen 1</span>
            </div>
            <nav class="nav">
                <a class="nav-item active" data-tab="1" onclick="switchTab(1)">精选歌单</a>
                <a class="nav-item" data-tab="2" onclick="switchTab(2)">我的歌单</a>
                <a class="nav-item" data-tab="3" onclick="switchTab(3)">快速搜索</a>
                <a class="nav-item" data-tab="4" onclick="switchTab(4)">设置</a>
            </nav>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <div class="container">

            <!-- 精选歌单 -->
            <section id="tab-1" class="tab-content active">
                <div class="page-header">
                    <h2>精选歌单</h2>
                    <div class="source-tabs">
                        <button class="source-btn active" onclick="switchSource(0, this)">网易云</button>
                        <button class="source-btn" onclick="switchSource(1, this)">QQ音乐</button>
                        <button class="source-btn" onclick="switchSource(2, this)">酷狗</button>
                    </div>
                </div>
                <div id="recommend-playlists" class="playlist-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>

            <!-- 我的歌单 -->
            <section id="tab-2" class="tab-content">
                <div class="page-header">
                    <h2>我的歌单</h2>
                    <button class="btn btn-primary" onclick="showCreateDialog()">+ 新建歌单</button>
                </div>
                <div id="my-playlists" class="playlist-grid">
                    <!-- 动态渲染 -->
                </div>
            </section>

            <!-- 快速搜索 -->
            <section id="tab-3" class="tab-content">
                <div class="search-section">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="搜索歌曲、歌手、专辑..." oninput="onSearchInput()">
                    </div>
                    <div class="search-tabs">
                        <button class="search-tab active" onclick="switchSearchTab(0, this)">网易云</button>
                        <button class="search-tab" onclick="switchSearchTab(1, this)">QQ音乐</button>
                        <button class="search-tab" onclick="switchSearchTab(2, this)">酷狗</button>
                    </div>
                    <div id="search-results" class="song-list">
                        <!-- 动态渲染 -->
                    </div>
                </div>
            </section>

            <!-- 设置 -->
            <section id="tab-4" class="tab-content">
                <div class="settings-card">
                    <h3>关于</h3>
                    <p>Listen 1 PHP 版本 - 在线音乐播放器</p>
                    <p>版本: 1.0.0</p>
                    <p>支持多平台音乐搜索与播放</p>
                    <p>实时更新与内容同步功能</p>
                </div>
                <div class="settings-card">
                    <h3>同步状态</h3>
                    <p>服务器状态: <span id="sync-status" class="status-ok">已连接</span></p>
                    <p>最后同步: <span id="last-sync">-</span></p>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="manualSync()">手动同步</button>
                        <button id="auto-sync-btn" class="btn" onclick="toggleAutoSync()">关闭自动同步</button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- 歌单详情弹窗 -->
    <div id="playlist-modal" class="modal-overlay" style="display:none;">
        <div class="modal playlist-detail-modal">
            <div class="modal-header">
                <span class="modal-close" onclick="closePlaylistDetail()">×</span>
            </div>
            <div class="modal-body">
                <div class="playlist-header">
                    <img id="detail-cover" src="/static/images/placeholder.png" alt="封面">
                    <div class="playlist-info">
                        <h2 id="detail-title">歌单名称</h2>
                        <div class="playlist-actions">
                            <button class="btn btn-primary" onclick="playCurrentList()">▶ 播放全部</button>
                            <button id="detail-delete-btn" class="btn btn-danger" onclick="deleteCurrentList()">删除歌单</button>
                            <button id="detail-clone-btn" class="btn btn-success" onclick="cloneCurrentList()" style="display:none;">收藏歌单</button>
                        </div>
                    </div>
                </div>
                <div id="detail-songs" class="song-list">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 新建歌单弹窗 -->
    <div id="create-modal" class="modal-overlay" style="display:none;">
        <div class="modal small-modal">
            <div class="modal-header">
                <h3>新建歌单</h3>
                <span class="modal-close" onclick="closeCreateDialog()">×</span>
            </div>
            <div class="modal-body">
                <input type="text" id="new-playlist-name" class="form-input" placeholder="请输入歌单名称">
                <div class="modal-actions">
                    <button class="btn" onclick="closeCreateDialog()">取消</button>
                    <button class="btn btn-primary" onclick="createPlaylist()">创建</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- 底部播放栏 -->
    <footer class="player-bar">
        <div class="player-left">
            <img id="player-cover" src="/static/images/placeholder.png" alt="封面">
            <div class="player-info">
                <div class="player-title" id="player-title">未播放</div>
                <div class="player-artist" id="player-artist">未知艺术家</div>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" onclick="prevTrack()" title="上一首">⏮</button>
                <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="播放/暂停">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()" title="下一首">⏭</button>
            </div>
            <div class="player-progress">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <button class="ctrl-btn" onclick="togglePlayMode()" id="mode-btn" title="播放模式">🔁</button>
            <button class="ctrl-btn" onclick="togglePlaylistMenu()" title="播放列表">📋</button>
            <button class="ctrl-btn" onclick="addCurrentToPlaylist()" title="添加到歌单">➕</button>
        </div>

        <!-- 播放列表弹窗 -->
        <div id="playlist-menu" class="playlist-menu" style="display:none;">
            <div class="menu-header">
                <span>播放列表</span>
                <button class="menu-close" onclick="togglePlaylistMenu()">×</button>
            </div>
            <div class="menu-actions">
                <button class="btn-link" onclick="clearPlaylist()">清空列表</button>
            </div>
            <ul id="playlist-menu-list" class="menu-list">
                <!-- 动态渲染 -->
            </ul>
        </div>
    </footer>

    <audio id="audio-player"></audio>

    <script src="/static/js/app.js"></script>
</body>
</html>
