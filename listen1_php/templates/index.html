<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Listen 1 - 在线音乐播放器</title>
    <link rel="stylesheet" href="/css/player.css?v=2026062901">
    <style>
        /* 现代化播放器样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; }

        /* 头部 */
        .header { background: rgba(0,0,0,0.3); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 32px; }
        .nav { display: flex; gap: 10px; }
        .nav-item { padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.3s; background: rgba(255,255,255,0.1); }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.3); }
        .theme-toggle { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; }

        /* 主要内容 */
        .main { padding: 80px 20px 120px; max-width: 1400px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 页面标题 */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .page-header h2 { font-size: 28px; font-weight: 600; }
        .source-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .source-btn { padding: 8px 16px; border: none; border-radius: 20px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: all 0.3s; }
        .source-btn:hover, .source-btn.active { background: rgba(255,255,255,0.3); }

        /* 歌单网格 */
        .playlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .playlist-card { background: rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
        .playlist-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .playlist-cover { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; color: rgba(255,255,255,0.5); position: relative; overflow: hidden; background-size: cover; background-position: center; }
        .playlist-cover.has-img { background: none; }
        .playlist-cover .cover-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .playlist-card:hover .cover-overlay { opacity: 1; }
        .cover-overlay .play-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #333; }
        .playlist-title { padding: 15px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 歌曲列表 */
        .song-list { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
        .song-item { display: grid; grid-template-columns: 50px 1fr 150px 100px 120px; align-items: center; padding: 12px 15px; gap: 15px; transition: background 0.3s; cursor: pointer; }
        .song-item:hover { background: rgba(255,255,255,0.1); }
        .song-item:nth-child(even) { background: rgba(255,255,255,0.03); }
        .song-item:nth-child(even):hover { background: rgba(255,255,255,0.1); }
        .song-index { text-align: center; color: rgba(255,255,255,0.5); }
        .song-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist, .song-album { color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .song-actions { display: flex; gap: 8px; }
        .song-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .song-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }

        /* 搜索 */
        .search-box { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 15px 20px; border: none; border-radius: 30px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; outline: none; transition: all 0.3s; }
        .search-input:focus { background: rgba(255,255,255,0.2); }
        .search-input::placeholder { color: rgba(255,255,255,0.5); }

        /* 播放器 */
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); padding: 15px 20px; display: flex; align-items: center; gap: 20px; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.1); }
        .player-info { display: flex; align-items: center; gap: 15px; min-width: 250px; }
        .player-cover { width: 60px; height: 60px; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
        .player-cover img { width: 100%; height: 100%; object-fit: cover; }
        .player-text { overflow: hidden; }
        .player-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .player-artist { font-size: 12px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 控制按钮 */
        .player-controls { display: flex; align-items: center; gap: 15px; }
        .ctrl-btn { width: 40px; height: 40px; border: none; border-radius: 50%; background: transparent; color: #fff; font-size: 18px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .ctrl-btn.play { width: 50px; height: 50px; background: #fff; color: #333; font-size: 20px; }
        .ctrl-btn.play:hover { background: #f0f0f0; transform: scale(1.15); }

        /* 进度条 */
        .player-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
        .time-display { font-size: 12px; color: rgba(255,255,255,0.6); min-width: 45px; text-align: center; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; width: 0%; transition: width 0.1s linear; }
        .progress-bar:hover .progress-fill { background: linear-gradient(90deg, #7c8ffa, #8e5db5); }

        /* 音量 */
        .player-volume { display: flex; align-items: center; gap: 8px; min-width: 120px; }
        .volume-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 18px; }
        .volume-slider { width: 80px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; }
        .volume-fill { height: 100%; background: #fff; border-radius: 2px; width: 80%; }

        /* 歌词显示 */
        .lyrics-display { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 600px; width: 90%; text-align: center; pointer-events: none; z-index: 50; }
        .lyric-line { font-size: 24px; color: rgba(255,255,255,0.3); padding: 10px 0; transition: all 0.3s; line-height: 1.6; }
        .lyric-line.active { font-size: 28px; color: #fff; font-weight: 600; text-shadow: 0 0 20px rgba(255,255,255,0.5); }

        /* 播放列表 */
        .playlist-menu { position: fixed; right: -400px; top: 0; bottom: 80px; width: 400px; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); transition: right 0.3s; z-index: 999; overflow-y: auto; border-left: 1px solid rgba(255,255,255,0.1); }
        .playlist-menu.show { right: 0; }
        .menu-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-header h3 { font-size: 18px; }
        .menu-close { background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .menu-list { list-style: none; padding: 0; }
        .menu-item { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.3s; }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        .menu-item.playing { background: rgba(102,126,234,0.2); }
        .menu-item-info { flex: 1; overflow: hidden; }
        .menu-item-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-item-artist { font-size: 12px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-item-remove { background: transparent; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 18px; padding: 5px; }
        .menu-item-remove:hover { color: #ff4757; }

        /* 弹窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.show { display: flex; }
        .modal { background: rgba(20,20,30,0.95); border-radius: 16px; max-width: 900px; width: 95%; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; background: rgba(20,20,30,0.95); z-index: 1; }
        .modal-header h2 { font-size: 24px; }
        .modal-close { background: transparent; border: none; color: #fff; font-size: 28px; cursor: pointer; }
        .modal-body { padding: 20px; }
        .playlist-detail-header { display: flex; gap: 20px; margin-bottom: 20px; }
        .detail-cover { width: 200px; height: 200px; border-radius: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 64px; overflow: hidden; flex-shrink: 0; }
        .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; }
        .detail-title { font-size: 28px; font-weight: 600; }
        .detail-meta { color: rgba(255,255,255,0.6); }
        .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 24px; border: none; border-radius: 25px; font-size: 14px; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        /* 创建歌单弹窗 */
        .modal.small { max-width: 400px; }
        .modal.small .modal-body { padding: 30px; }
        .form-input { width: 100%; padding: 15px; border: none; border-radius: 10px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; margin-bottom: 20px; outline: none; }
        .form-input:focus { background: rgba(255,255,255,0.2); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* Toast提示 */
        .toast { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: all 0.3s; z-index: 3000; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 加载状态 */
        .loading { text-align: center; padding: 40px; color: rgba(255,255,255,0.6); }
        .empty-tip { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.5); }

        /* 响应式 */
        @media (max-width: 768px) {
            .nav { display: none; }
            .player-bar { flex-wrap: wrap; padding: 10px; }
            .player-info { min-width: auto; }
            .player-progress { order: -1; width: 100%; margin-bottom: 10px; }
            .playlist-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .song-item { grid-template-columns: 40px 1fr 80px; }
            .song-album, .song-actions { display: none; }
            .playlist-menu { width: 100%; right: -100%; }
            .lyric-line { font-size: 18px; }
        }

        /* 播放模式按钮 */
        .play-mode { font-size: 14px; }

        /* 设置页面 */
        .settings-section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .settings-section h3 { margin-bottom: 15px; font-size: 18px; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .settings-item:last-child { border-bottom: none; }
        .settings-label { color: rgba(255,255,255,0.8); }
        .sync-status { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .sync-status.online { background: rgba(46,213,115,0.2); color: #2ed573; }
        .sync-status.offline { background: rgba(255,71,87,0.2); color: #ff4757; }

        /* 版本信息 */
        .version-info { text-align: center; padding: 40px; color: rgba(255,255,255,0.5); font-size: 14px; }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">♪</span>
            <span>Listen 1</span>
        </div>
        <nav class="nav">
            <div class="nav-item active" data-tab="1">精选歌单</div>
            <div class="nav-item" data-tab="2">我的歌单</div>
            <div class="nav-item" data-tab="3">搜索</div>
            <div class="nav-item" data-tab="4">设置</div>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </header>

    <!-- 主要内容 -->
    <main class="main">
        <!-- 精选歌单 -->
        <section id="tab-1" class="tab-content active">
            <div class="page-header">
                <h2>精选歌单</h2>
                <div class="source-tabs">
                    <button class="source-btn active" data-source="netease">网易云</button>
                    <button class="source-btn" data-source="qq">QQ音乐</button>
                    <button class="source-btn" data-source="kugou">酷狗</button>
                </div>
            </div>
            <div id="recommend-playlists" class="playlist-grid">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <!-- 我的歌单 -->
        <section id="tab-2" class="tab-content">
            <div class="page-header">
                <h2>我的歌单</h2>
                <button class="btn btn-primary" onclick="showCreateModal()">+ 新建歌单</button>
            </div>
            <div id="my-playlists" class="playlist-grid">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <!-- 搜索 -->
        <section id="tab-3" class="tab-content">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="搜索歌曲、歌手或专辑...">
            </div>
            <div id="search-results" class="song-list">
                <div class="empty-tip">输入关键词开始搜索</div>
            </div>
        </section>

        <!-- 设置 -->
        <section id="tab-4" class="tab-content">
            <div class="settings-section">
                <h3>播放设置</h3>
                <div class="settings-item">
                    <span class="settings-label">播放模式</span>
                    <button class="btn btn-secondary" onclick="togglePlayMode()">🔁 列表循环</button>
                </div>
                <div class="settings-item">
                    <span class="settings-label">音量</span>
                    <input type="range" min="0" max="100" value="80" style="width: 150px;" onchange="setVolume(this.value)">
                </div>
            </div>

            <div class="settings-section">
                <h3>同步状态</h3>
                <div class="settings-item">
                    <span class="settings-label">服务器状态</span>
                    <span id="sync-status" class="sync-status online">已连接</span>
                </div>
                <div class="settings-item">
                    <span class="settings-label">最后同步</span>
                    <span id="last-sync-time">-</span>
                </div>
                <div class="settings-item">
                    <button class="btn btn-secondary" onclick="manualSync()">手动同步</button>
                    <button class="btn btn-secondary" onclick="toggleAutoSync()">自动同步: 开</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>关于</h3>
                <div class="settings-item">
                    <span class="settings-label">版本</span>
                    <span>2.33.0</span>
                </div>
                <div class="settings-item">
                    <span class="settings-label">数据源</span>
                    <span>Meting API</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 歌词显示 -->
    <div id="lyrics-display" class="lyrics-display" style="display: none;"></div>

    <!-- 播放列表 -->
    <div id="playlist-menu" class="playlist-menu">
        <div class="menu-header">
            <h3>播放列表</h3>
            <button class="menu-close" onclick="togglePlaylistMenu()">×</button>
        </div>
        <ul id="menu-list" class="menu-list"></ul>
    </div>

    <!-- 歌单详情弹窗 -->
    <div id="playlist-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">歌单详情</h2>
                <button class="modal-close" onclick="closePlaylistModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="playlist-detail-header">
                    <div id="modal-cover" class="detail-cover">♪</div>
                    <div class="detail-info">
                        <div id="modal-count" class="detail-meta">0 首歌曲</div>
                        <div class="detail-actions">
                            <button class="btn btn-primary" onclick="playAll()">▶ 播放全部</button>
                            <button id="btn-favorite" class="btn btn-secondary" onclick="favoritePlaylist()">♡ 收藏</button>
                            <button id="btn-delete" class="btn btn-secondary" onclick="deletePlaylist()" style="display:none;">🗑 删除</button>
                        </div>
                    </div>
                </div>
                <div id="modal-songs" class="song-list"></div>
            </div>
        </div>
    </div>

    <!-- 创建歌单弹窗 -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal small">
            <div class="modal-header">
                <h3>新建歌单</h3>
                <button class="modal-close" onclick="closeCreateModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="text" id="new-playlist-name" class="form-input" placeholder="输入歌单名称">
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeCreateModal()">取消</button>
                    <button class="btn btn-primary" onclick="createPlaylist()">创建</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部播放器 -->
    <footer class="player-bar">
        <div class="player-info">
            <div id="player-cover" class="player-cover">♪</div>
            <div class="player-text">
                <div id="player-title" class="player-title">未播放</div>
                <div id="player-artist" class="player-artist">-</div>
            </div>
        </div>

        <div class="player-controls">
            <button class="ctrl-btn" onclick="togglePlayMode()" title="播放模式">🔁</button>
            <button class="ctrl-btn" onclick="playPrev()" title="上一首">⏮</button>
            <button id="play-btn" class="ctrl-btn play" onclick="togglePlay()" title="播放/暂停">▶</button>
            <button class="ctrl-btn" onclick="playNext()" title="下一首">⏭</button>
            <button class="ctrl-btn" onclick="toggleLyrics()" title="歌词">📄</button>
        </div>

        <div class="player-progress">
            <span id="current-time" class="time-display">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="total-time" class="time-display">0:00</span>
        </div>

        <div class="player-volume">
            <button class="volume-btn" onclick="toggleMute()">🔊</button>
            <div class="volume-slider" onclick="setVolumeFromClick(event)">
                <div class="volume-fill" id="volume-fill" style="width: 80%;"></div>
            </div>
        </div>

        <button class="ctrl-btn" onclick="togglePlaylistMenu()" title="播放列表">📋</button>
        <button class="ctrl-btn" onclick="addToMyPlaylist()" title="添加到歌单">❤️</button>
    </footer>

    <audio id="audio-player"></audio>
    <div id="toast" class="toast"></div>

    <script>
    // 全局状态
    const App = {
        currentTab: 1,
        currentSource: 'netease',
        currentPlaylist: [],
        currentListId: null,
        isMine: false,
        playMode: 'list', // list, single, random
        autoSync: true,
        lastSyncTime: 0,
        pollInterval: null,
        showLyrics: false,
        currentLyricIndex: 0,
        lyrics: []
    };

    const Player = {
        playlist: [],
        currentIndex: -1,
        isPlaying: false,
        audio: null,
        volume: 0.8,
        isMuted: false
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        Player.audio = document.getElementById('audio-player');
        Player.audio.volume = Player.volume;

        // 事件监听
        Player.audio.addEventListener('timeupdate', updateProgress);
        Player.audio.addEventListener('ended', playNext);
        Player.audio.addEventListener('play', () => {
            Player.isPlaying = true;
            document.getElementById('play-btn').textContent = '⏸';
        });
        Player.audio.addEventListener('pause', () => {
            Player.isPlaying = false;
            document.getElementById('play-btn').textContent = '▶';
        });

        // 导航点击
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => switchTab(parseInt(item.dataset.tab)));
        });

        // 平台切换
        document.querySelectorAll('.source-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                App.currentSource = btn.dataset.source;
                loadRecommendPlaylists();
            });
        });

        // 搜索输入
        document.getElementById('search-input').addEventListener('input', debounce(doSearch, 300));

        // 初始化加载
        loadRecommendPlaylists();
        loadMyPlaylists();
        startSyncPolling();
        updateLastSync();
    });

    // 辅助函数
    function $(id) { return document.getElementById(id); }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    function showToast(msg) {
        const toast = $('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function httpGet(url, callback) {
        fetch(url).then(r => r.json()).then(callback).catch(() => callback(null));
    }

    function httpPost(url, data, callback) {
        const formData = new FormData();
        for (let key in data) formData.append(key, data[key]);
        fetch(url, { method: 'POST', body: formData })
            .then(r => r.json())
            .then(callback)
            .catch(() => callback(null));
    }

    // 标签切换
    function switchTab(tabId) {
        App.currentTab = tabId;
        document.querySelectorAll('.nav-item').forEach((item, idx) => {
            item.classList.toggle('active', idx === tabId - 1);
        });
        document.querySelectorAll('.tab-content').forEach((tab, idx) => {
            tab.classList.toggle('active', idx === tabId - 1);
        });
    }

    // 精选歌单
    function loadRecommendPlaylists() {
        $('recommend-playlists').innerHTML = '<div class="loading">加载中...</div>';
        httpGet('/?path=playlist', function(data) {
            if (!data || !data.result) {
                $('recommend-playlists').innerHTML = '<div class="empty-tip">加载失败</div>';
                return;
            }
            renderRecommendPlaylists(data.result);
        });
    }

    function renderRecommendPlaylists(playlists) {
        const container = $('recommend-playlists');
        container.innerHTML = '';
        playlists.forEach(pl => {
            const card = document.createElement('div');
            card.className = 'playlist-card';
            card.innerHTML = `
                <div class="playlist-cover">
                    <div class="cover-overlay">
                        <div class="play-icon">▶</div>
                    </div>
                </div>
                <div class="playlist-title">${escapeHtml(pl.title)}</div>
            `;
            card.addEventListener('click', () => showPlaylistDetail(pl.id, pl.source));
            container.appendChild(card);
        });
    }

    // 我的歌单
    function loadMyPlaylists() {
        $('my-playlists').innerHTML = '<div class="loading">加载中...</div>';
        httpGet('/?path=my_playlist', function(data) {
            if (!data || !data.result) {
                $('my-playlists').innerHTML = '<div class="empty-tip">加载失败</div>';
                return;
            }
            renderMyPlaylists(data.result);
        });
    }

    function renderMyPlaylists(playlists) {
        const container = $('my-playlists');
        if (!playlists || playlists.length === 0) {
            container.innerHTML = '<div class="empty-tip">暂无歌单，点击右上角创建</div>';
            return;
        }
        container.innerHTML = '';
        playlists.forEach(pl => {
            const card = document.createElement('div');
            card.className = 'playlist-card';
            card.innerHTML = `
                <div class="playlist-cover">
                    <div class="cover-overlay">
                        <div class="play-icon">▶</div>
                    </div>
                </div>
                <div class="playlist-title">${escapeHtml(pl.title)} <span style="color:rgba(255,255,255,0.5)">(${pl.tracks?.length || 0})</span></div>
            `;
            card.addEventListener('click', () => showMyPlaylistDetail(pl));
            container.appendChild(card);
        });
    }

    function showMyPlaylistDetail(playlist) {
        App.currentPlaylist = playlist.tracks || [];
        App.currentListId = playlist.id;
        App.isMine = true;

        $('modal-title').textContent = playlist.title;
        $('modal-count').textContent = (playlist.tracks?.length || 0) + ' 首歌曲';
        $('modal-cover').innerHTML = '♪';
        $('modal-cover').style.backgroundImage = '';

        $('btn-favorite').style.display = 'none';
        $('btn-delete').style.display = 'inline-block';

        renderModalSongs(playlist.tracks || []);
        $('playlist-modal').classList.add('show');
    }

    // 歌单详情
    function showPlaylistDetail(listId, source) {
        $('playlist-modal').classList.add('show');
        httpGet('/?path=playlist_detail&list_id=' + listId + '&source=' + (source || 'netease'), function(data) {
            if (!data || data.status !== 'success') {
                showToast('加载失败');
                return;
            }
            const info = data.data;
            App.currentPlaylist = info.tracks || [];
            App.currentListId = listId;
            App.isMine = info.is_mine || false;

            $('modal-title').textContent = info.title;
            $('modal-count').textContent = (info.tracks?.length || 0) + ' 首歌曲';

            if (info.cover_img_url) {
                $('modal-cover').innerHTML = '';
                $('modal-cover').style.backgroundImage = 'url(' + info.cover_img_url + ')';
                $('modal-cover').classList.add('has-img');
            } else {
                $('modal-cover').innerHTML = '♪';
                $('modal-cover').style.backgroundImage = '';
                $('modal-cover').classList.remove('has-img');
            }

            $('btn-favorite').style.display = info.is_mine ? 'none' : 'inline-block';
            $('btn-delete').style.display = info.is_mine ? 'inline-block' : 'none';

            renderModalSongs(info.tracks || []);
        });
    }

    function renderModalSongs(songs) {
        const container = $('modal-songs');
        if (!songs || songs.length === 0) {
            container.innerHTML = '<div class="empty-tip">歌单为空</div>';
            return;
        }
        container.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `
                <div class="song-index">${index + 1}</div>
                <div class="song-name">${escapeHtml(song.title)}</div>
                <div class="song-artist">${escapeHtml(song.artist)}</div>
                <div class="song-album">${escapeHtml(song.album)}</div>
                <div class="song-actions">
                    <button class="song-btn" onclick="playSongFromList(${index})" title="播放">▶</button>
                    <button class="song-btn" onclick="addSongToPlaylist(${index})" title="添加">+</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function closePlaylistModal() {
        $('playlist-modal').classList.remove('show');
    }

    // 播放控制
    function playSong(song, addToList = true) {
        if (addToList) {
            Player.playlist.push(song);
            Player.currentIndex = Player.playlist.length - 1;
        }

        // 获取播放URL
        let url = song.url;
        if (!url) {
            httpGet('/?path=song_url&song_id=' + song.id, function(data) {
                if (data && data.status === 'success' && data.url) {
                    url = data.url;
                    playUrl(url, song);
                } else {
                    showToast('无法获取播放地址');
                }
            });
        } else {
            playUrl(url, song);
        }
    }

    function playUrl(url, song) {
        Player.audio.src = url;
        Player.audio.play().catch(e => console.warn(e));

        // 更新UI
        $('player-title').textContent = song.title;
        $('player-artist').textContent = song.artist;

        if (song.img) {
            $('player-cover').innerHTML = '<img src="' + song.img + '" alt="cover">';
        } else {
            $('player-cover').innerHTML = '♪';
        }

        // 加载歌词
        loadLyrics(song.id);

        updatePlaylistMenu();
    }

    function playSongFromList(index) {
        if (App.currentPlaylist[index]) {
            playSong(App.currentPlaylist[index]);
        }
    }

    function addSongToPlaylist(index) {
        if (App.currentPlaylist[index]) {
            addToMyPlaylist(App.currentPlaylist[index]);
        }
    }

    function togglePlay() {
        if (!Player.audio.src) {
            if (Player.playlist.length > 0) {
                Player.currentIndex = 0;
                playSong(Player.playlist[0]);
            }
            return;
        }
        if (Player.isPlaying) {
            Player.audio.pause();
        } else {
            Player.audio.play().catch(e => console.warn(e));
        }
    }

    function playPrev() {
        if (Player.playlist.length === 0) return;
        Player.currentIndex = (Player.currentIndex - 1 + Player.playlist.length) % Player.playlist.length;
        playSong(Player.playlist[Player.currentIndex]);
    }

    function playNext() {
        if (Player.playlist.length === 0) return;
        if (App.playMode === 'random') {
            Player.currentIndex = Math.floor(Math.random() * Player.playlist.length);
        } else if (App.playMode === 'single') {
            Player.audio.currentTime = 0;
            Player.audio.play().catch(e => console.warn(e));
            return;
        } else {
            Player.currentIndex = (Player.currentIndex + 1) % Player.playlist.length;
        }
        playSong(Player.playlist[Player.currentIndex]);
    }

    function playAll() {
        if (App.currentPlaylist.length > 0) {
            Player.playlist = [...App.currentPlaylist];
            Player.currentIndex = 0;
            playSong(Player.playlist[0]);
            showToast('开始播放');
        }
    }

    // 进度条
    function updateProgress() {
        if (Player.audio.duration) {
            const pct = (Player.audio.currentTime / Player.audio.duration) * 100;
            $('progress-fill').style.width = pct + '%';
            $('current-time').textContent = formatTime(Player.audio.currentTime);
            $('total-time').textContent = formatTime(Player.audio.duration);
            updateLyricHighlight();
        }
    }

    function seekTo(event) {
        const bar = event.currentTarget;
        const rect = bar.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const pct = x / rect.width;
        if (Player.audio.duration) {
            Player.audio.currentTime = pct * Player.audio.duration;
        }
    }

    // 音量控制
    function setVolume(value) {
        Player.volume = value / 100;
        Player.audio.volume = Player.volume;
        $('volume-fill').style.width = value + '%';
        Player.isMuted = false;
    }

    function setVolumeFromClick(event) {
        const bar = event.currentTarget;
        const rect = bar.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const pct = Math.round((x / rect.width) * 100);
        setVolume(pct);
    }

    function toggleMute() {
        Player.isMuted = !Player.isMuted;
        if (Player.isMuted) {
            Player.audio.volume = 0;
            $('volume-fill').style.width = '0%';
        } else {
            Player.audio.volume = Player.volume;
            $('volume-fill').style.width = (Player.volume * 100) + '%';
        }
    }

    // 播放模式
    function togglePlayMode() {
        const modes = ['list', 'random', 'single'];
        const names = ['🔁 列表循环', '🔀 随机播放', '🔂 单曲循环'];
        const currentIdx = modes.indexOf(App.playMode);
        App.playMode = modes[(currentIdx + 1) % modes.length];
        showToast(names[(currentIdx + 1) % names.length]);
    }

    // 歌词
    function toggleLyrics() {
        App.showLyrics = !App.showLyrics;
        $('lyrics-display').style.display = App.showLyrics ? 'block' : 'none';
    }

    function loadLyrics(songId) {
        App.lyrics = [];
        App.currentLyricIndex = 0;
        $('lyrics-display').innerHTML = '<div class="lyric-line active">♪ 正在加载歌词...</div>';

        httpGet('/?path=lyric&song_id=' + songId, function(data) {
            if (!data || data.status !== 'success' || !data.lrc) {
                $('lyrics-display').innerHTML = '<div class="lyric-line active">♪ 无歌词</div>';
                return;
            }
            parseLrc(data.lrc);
            renderLyrics();
        });
    }

    function parseLrc(lrc) {
        const lines = lrc.split('\n');
        const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
        App.lyrics = [];

        lines.forEach(line => {
            const match = line.match(timeRegex);
            if (match) {
                const minutes = parseInt(match[1]);
                const seconds = parseInt(match[2]);
                const ms = parseInt(match[3].padEnd(3, '0'));
                const time = minutes * 60 + seconds + ms / 1000;
                const text = match[4].trim() || '♪';
                App.lyrics.push({ time, text });
            }
        });

        App.lyrics.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
        const container = $('lyrics-display');
        container.innerHTML = App.lyrics.map((l, i) =>
            `<div class="lyric-line" data-index="${i}">${escapeHtml(l.text)}</div>`
        ).join('');
    }

    function updateLyricHighlight() {
        if (!App.showLyrics || App.lyrics.length === 0) return;

        const currentTime = Player.audio.currentTime;
        let index = 0;

        for (let i = 0; i < App.lyrics.length; i++) {
            if (App.lyrics[i].time <= currentTime) {
                index = i;
            } else {
                break;
            }
        }

        if (index !== App.currentLyricIndex) {
            App.currentLyricIndex = index;
            document.querySelectorAll('.lyric-line').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }
    }

    // 播放列表菜单
    function togglePlaylistMenu() {
        $('playlist-menu').classList.toggle('show');
        updatePlaylistMenu();
    }

    function updatePlaylistMenu() {
        const list = $('menu-list');
        list.innerHTML = Player.playlist.map((song, i) => `
            <li class="menu-item ${i === Player.currentIndex ? 'playing' : ''}" onclick="playFromMenu(${i})">
                <div class="menu-item-info">
                    <div class="menu-item-title">${escapeHtml(song.title)}</div>
                    <div class="menu-item-artist">${escapeHtml(song.artist)}</div>
                </div>
                <button class="menu-item-remove" onclick="event.stopPropagation(); removeFromMenu(${i})">×</button>
            </li>
        `).join('');
    }

    function playFromMenu(index) {
        Player.currentIndex = index;
        playSong(Player.playlist[index]);
    }

    function removeFromMenu(index) {
        Player.playlist.splice(index, 1);
        if (index < Player.currentIndex) {
            Player.currentIndex--;
        } else if (index === Player.currentIndex) {
            if (Player.playlist.length > 0) {
                Player.currentIndex = Math.min(Player.currentIndex, Player.playlist.length - 1);
                playSong(Player.playlist[Player.currentIndex]);
            } else {
                Player.currentIndex = -1;
                Player.audio.src = '';
                $('player-title').textContent = '未播放';
                $('player-artist').textContent = '-';
            }
        }
        updatePlaylistMenu();
    }

    // 搜索
    function doSearch() {
        const keywords = $('search-input').value.trim();
        const container = $('search-results');

        if (!keywords) {
            container.innerHTML = '<div class="empty-tip">输入关键词开始搜索</div>';
            return;
        }

        container.innerHTML = '<div class="loading">搜索中...</div>';

        httpGet('/?path=search&keywords=' + encodeURIComponent(keywords) + '&source=' + App.currentSource, function(data) {
            if (!data || !data.result || data.result.length === 0) {
                container.innerHTML = '<div class="empty-tip">未找到相关歌曲</div>';
                return;
            }
            renderSearchResults(data.result);
        });
    }

    function renderSearchResults(songs) {
        const container = $('search-results');
        container.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `
                <div class="song-index">${index + 1}</div>
                <div class="song-name">${escapeHtml(song.title)}</div>
                <div class="song-artist">${escapeHtml(song.artist)}</div>
                <div class="song-album">${escapeHtml(song.album)}</div>
                <div class="song-actions">
                    <button class="song-btn" onclick="playSongFromSearch(${index})" title="播放">▶</button>
                    <button class="song-btn" onclick="addSearchSongToPlaylist(${index})" title="添加">+</button>
                </div>
            `;
            container.appendChild(item);
        });
        window.searchResults = songs;
    }

    function playSongFromSearch(index) {
        if (window.searchResults && window.searchResults[index]) {
            playSong(window.searchResults[index]);
        }
    }

    function addSearchSongToPlaylist(index) {
        if (window.searchResults && window.searchResults[index]) {
            addToMyPlaylist(window.searchResults[index]);
        }
    }

    // 歌单管理
    function showCreateModal() {
        $('new-playlist-name').value = '';
        $('create-modal').classList.add('show');
    }

    function closeCreateModal() {
        $('create-modal').classList.remove('show');
    }

    function createPlaylist() {
        const name = $('new-playlist-name').value.trim();
        if (!name) {
            showToast('请输入歌单名称');
            return;
        }
        httpPost('/?path=create_playlist', { title: name }, function(data) {
            if (data && data.status === 'success') {
                showToast('创建成功');
                closeCreateModal();
                loadMyPlaylists();
            } else {
                showToast('创建失败');
            }
        });
    }

    function addToMyPlaylist(song) {
        // 获取我的歌单列表，让用户选择
        httpGet('/?path=my_playlist', function(data) {
            if (!data || !data.result || data.result.length === 0) {
                showToast('请先创建歌单');
                return;
            }
            // 简单起见，添加到第一个歌单
            const listId = data.result[0].id;
            httpPost('/?path=add_track', {
                list_id: listId,
                track: JSON.stringify(song)
            }, function(result) {
                if (result && result.status === 'success') {
                    showToast('已添加到歌单');
                } else {
                    showToast(result?.message || '添加失败');
                }
            });
        });
    }

    function favoritePlaylist() {
        const title = $('modal-title').textContent;
        const tracks = App.currentPlaylist;
        httpPost('/?path=favorite', {
            list_id: App.currentListId,
            source: App.currentSource,
            title: title,
            tracks: JSON.stringify(tracks)
        }, function(data) {
            if (data && data.status === 'success') {
                showToast('收藏成功');
                closePlaylistModal();
                loadMyPlaylists();
            } else {
                showToast('收藏失败');
            }
        });
    }

    function deletePlaylist() {
        if (!confirm('确定要删除这个歌单吗？')) return;
        httpPost('/?path=delete_playlist', { list_id: App.currentListId }, function(data) {
            if (data && data.status === 'success') {
                showToast('删除成功');
                closePlaylistModal();
                loadMyPlaylists();
            } else {
                showToast('删除失败');
            }
        });
    }

    // 同步
    function startSyncPolling() {
        if (App.pollInterval) clearInterval(App.pollInterval);
        App.pollInterval = setInterval(checkUpdate, 5000);
    }

    function checkUpdate() {
        httpGet('/?path=check_update&since=' + App.lastSyncTime, function(data) {
            if (data && data.has_update) {
                App.lastSyncTime = data.timestamp;
                updateLastSync();
                loadMyPlaylists();
            }
        });
    }

    function manualSync() {
        httpGet('/?path=sync', function(data) {
            App.lastSyncTime = Date.now();
            updateLastSync();
            showToast('同步成功');
            loadMyPlaylists();
        });
    }

    function toggleAutoSync() {
        App.autoSync = !App.autoSync;
        if (App.autoSync) {
            startSyncPolling();
            $('sync-status').className = 'sync-status online';
            $('sync-status').textContent = '已连接';
        } else {
            clearInterval(App.pollInterval);
            $('sync-status').className = 'sync-status offline';
            $('sync-status').textContent = '未连接';
        }
    }

    function updateLastSync() {
        const now = new Date();
        $('last-sync-time').textContent = now.toLocaleTimeString();
    }

    // 主题切换
    function toggleTheme() {
        const body = document.body;
        if (body.style.background.includes('1a1a2e')) {
            body.style.background = 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)';
            body.style.color = '#333';
            document.querySelectorAll('.song-artist, .song-album, .menu-item-artist, .detail-meta, .settings-label').forEach(el => {
                el.style.color = 'rgba(0,0,0,0.6)';
            });
        } else {
            body.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
            body.style.color = '#fff';
            document.querySelectorAll('.song-artist, .song-album, .menu-item-artist, .detail-meta, .settings-label').forEach(el => {
                el.style.color = 'rgba(255,255,255,0.6)';
            });
        }
    }

    // 键盘快捷键
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;

        switch(e.code) {
            case 'Space':
                e.preventDefault();
                togglePlay();
                break;
            case 'ArrowLeft':
                Player.audio.currentTime -= 10;
                break;
            case 'ArrowRight':
                Player.audio.currentTime += 10;
                break;
            case 'ArrowUp':
                setVolume(Math.round(Player.volume * 100) + 5);
                break;
            case 'ArrowDown':
                setVolume(Math.round(Player.volume * 100) - 5);
                break;
        }
    });
    </script>
</body>
</html>
