<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listen 1 - 在线音乐播放器</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/cover.css" rel="stylesheet">
    <link href="/static/css/player.css" rel="stylesheet">
</head>
<body>

    <!-- 对话框 -->
    <div id="dialog-shadow" class="shadow" style="display:none;"></div>
    <div id="dialog" class="dialog" style="display:none;">
      <div class="dialog-header">
        <span id="dialog-title">添加到歌单</span>
        <span class="dialog-close" onclick="closeDialog()">×</span>
      </div>
      <div class="dialog-body">
        <!-- 歌单选择对话框 -->
        <div id="dialog-playlist">
          <ul class="dialog-playlist">
            <li class="detail-add" onclick="showNewPlaylistDialog()">
              <img src="/static/images/mycover.jpg" />
              <h2>新建歌单</h2>
            </li>
          </ul>
        </div>

        <!-- 创建新歌单对话框 -->
        <div id="dialog-newplaylist" style="display:none;" class="dialog-newplaylist">
           <input type="text" id="newplaylist-title" class="form-control" placeholder="输入歌单名称"/>
           <button class="btn btn-primary confirm-button" onclick="createAndAddPlaylist()">创建并添加</button>
           <button class="btn btn-default" onclick="cancelNewDialog()">取消</button>
        </div>
      </div>
    </div>

    <!-- 页面头部 -->
    <div class="masthead clearfix">
      <div class="inner">
        <img class="logo" src="/static/images/logo.png" alt="Listen 1"/>
        <h3 class="masthead-brand">Listen 1</h3>
        <nav>
          <ul class="nav masthead-nav">
            <li id="nav-1" class="active"><a onclick="showTag(1)">我的歌单</a></li>
            <li id="nav-2"><a onclick="showTag(2)">精选歌单</a></li>
            <li id="nav-3"><a onclick="showTag(3)">快速搜索</a></li>
            <li id="nav-4"><a onclick="showTag(4)">设置</a></li>
          </ul>
        </nav>
      </div>
    </div>

    <!-- 内容页面: 我的歌单 -->
    <div id="page-1" class="site-wrapper">
      <div class="site-wrapper-innerd">
        <div class="cover-container">
          <div class="playlist">
            <ul id="my-playlists" class="playlist-covers">
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- 内容页面: 精选歌单 -->
    <div id="page-2" class="site-wrapper" style="display:none;">
      <div class="site-wrapper-innerd">
        <div class="cover-container">
          <div class="btn-group-vertical source-list">
            <button type="button" class="btn btn-default active" onclick="changeRecommendTab(0, this)">网易</button>
            <button type="button" class="btn btn-default" onclick="changeRecommendTab(1, this)">虾米</button>
            <button type="button" class="btn btn-default" onclick="changeRecommendTab(2, this)">QQ音乐</button>
          </div>
          <div class="playlist">
            <ul id="recommend-playlists" class="playlist-covers">
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- 内容页面: 快速搜索 -->
    <div id="page-3" class="site-wrapper" style="display:none;">
      <div class="site-wrapper-innerd">
        <div class="cover-container">
          <div class="searchbox">
            <input type="text" id="search-input" class="form-control" placeholder="输入歌曲名，歌手或专辑" oninput="onSearchInput()" />

            <ul class="nav nav-tabs">
              <li class="active" onclick="changeSearchTab(0, this)"><a>网易</a></li>
              <li onclick="changeSearchTab(1, this)"><a>虾米</a></li>
              <li onclick="changeSearchTab(2, this)"><a>QQ音乐</a></li>
            </ul>

            <ul id="search-results" class="detail-songlist">
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- 内容页面: 设置 -->
    <div id="page-4" class="site-wrapper" style="display:none;">
      <div class="site-wrapper-innerd">
        <div class="cover-container">
          <div class="settings-title"><span>关于</span></div>
          <div class="settings-content">
            <p>Listen 1 PHP 版本 - 在线音乐播放器</p>
            <p>版本: 1.0.0</p>
            <p>支持多平台音乐搜索与播放</p>
            <p>实时更新与内容同步功能</p>
          </div>
          <div class="settings-title"><span>同步状态</span></div>
          <div class="settings-content">
            <p>服务器状态: <span id="sync-status" class="text-success">已连接</span></p>
            <p>最后同步: <span id="last-sync">-</span></p>
            <button class="btn btn-primary" onclick="manualSync()">手动同步</button>
            <button id="auto-sync-btn" class="btn btn-default" onclick="toggleAutoSync()">关闭自动同步</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 歌曲列表窗口 -->
    <div id="playlist-window" class="site-wrapper" style="display:none;">
      <div class="site-wrapper-innerd">
        <div class="cover-container">
          <div class="playlist-detail">
            <div class="detail-close">
              <span onclick="closePlaylistWindow()">&times;</span>
            </div>

            <div class="detail-head">
              <div class="detail-head-cover">
                <img id="detail-cover" src="/static/images/loading.gif">
              </div>
              <div class="detail-head-title">
                <h2 id="detail-title"></h2>
                <a class="play" onclick="playCurrentList()">播放</a>
                <a id="detail-delete" class="delete" onclick="deleteCurrentList()">删除</a>
                <a id="detail-clone" class="clone" onclick="cloneCurrentList()" style="display:none;">收藏</a>
              </div>
            </div>
            <ul id="detail-songs" class="detail-songlist">
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- 页面底部播放栏 -->
    <div class="mastfoot">
      <div class="m-playbar">
        <div class="btns">
          <a class="previous" title="上一首" onclick="prevTrack()">上一首</a>
          <a id="play-btn" class="play" title="播放/暂停" onclick="togglePlay()">播放/暂停</a>
          <a class="next" title="下一首" onclick="nextTrack()">下一首</a>
        </div>

        <div class="head">
          <img id="current-cover" src="/static/images/placeholder.png">
        </div>

        <div class="maininfo">
          <div class="words">
            <a class="overflowhide name notextdeco floatleft" id="current-title" title="">未播放</a>
            <span class="by overflowhide floatleft">
              <span id="current-artist" title="">未知艺术家</span>
            </span>
            <a id="current-source" class="src" title="原始链接" target="_blank"></a>
          </div>

          <div class="m-pbar" id="progress-bar">
            <div class="barbg" id="progressbar-bg">
              <div id="progress-cur" class="cur" style="width: 0%;">
                <span class="btn"><i></i></span>
              </div>
            </div>
            <span class="time"><em id="current-pos">0:00</em> <span id="duration-sep">/</span> <span id="current-dur">0:00</span></span>
          </div>
        </div>

        <div class="ctrl">
          <a class="icn icn-add" onclick="addToPlaylistDialog(currentSong)" title="添加到歌单"></a>
          <a id="mode-btn" class="icn icn-loop" title="循环" onclick="togglePlayMode()"></a>
          <a class="icn icn-list" title="列表" onclick="togglePlaylistMenu()"></a>
        </div>

        <div id="playlist-menu" class="menu" style="display:none;">
          <div class="menu-header">播放列表
              <a class="remove-all" onclick="togglePlaylistMenu()"><small>关闭</small></a>
              <a class="remove-all" onclick="clearPlaylist()"><small>(移除所有)</small></a>
          </div>
          <ul id="playlist-menu-list">
          </ul>
        </div>
      </div>

      <audio id="audio-player"></audio>
    </div>

    <script src="/static/js/vendor/jquery-1.12.2.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
